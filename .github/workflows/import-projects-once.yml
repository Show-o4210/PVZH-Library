name: Import PVZH projects once
on:
  push:
    branches: [migration/import-projects-20261005]
    paths: [.github/workflows/import-projects-once.yml]
permissions:
  contents: write
concurrency:
  group: pvzh-project-import-20261005
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Show-o4210/PVZH-Library'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Import pinned source histories and verify migration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMPORT_BRANCH: ${{ github.ref_name }}
          IMPORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-tags --branch "$IMPORT_BRANCH" https://github.com/Show-o4210/PVZH-Library.git work
          cd work
          test "$(git rev-parse HEAD)" = "$IMPORT_SHA"
          git config user.name Show-o4210
          git config user.email 297771278+Show-o4210@users.noreply.github.com
          python .github/migration/import-projects.py
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$IMPORT_BRANCH"
